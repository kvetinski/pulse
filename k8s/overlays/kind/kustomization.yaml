apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulse-dev

resources:
  - namespace.yaml
  - ../../base
  - ../../demo

patches:
  - path: patch-configmap.yaml
  - path: patch-deployment.yaml

images:
  - name: pulse
    newName: pulse
    newTag: local
  - name: pulse-demo-target
    newName: pulse-demo-target
    newTag: local
