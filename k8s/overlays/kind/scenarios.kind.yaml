version: 1
scenarios:
  # Recurring, two-slice healthy load keeps jobs/results/commits advancing during
  # kind soak and chaos runs without depending on another repository.
  - name: KindUnaryHealthySoak
    endpoint: http://grpc-target:50051
    scenarios_per_sec: 12
    max_concurrency: 4
    duration: 5s
    repeat:
      type: every
      interval: 10s
    partition_key_strategy: execution_key
    steps:
      - protocol: grpc
        service: pulse.demo.v1.DemoService
        method: Echo
        request_fields:
          message: pulse-kind-soak
          delay_ms: 20
          fail: false
        extract:
          echoed_message: message
          target_instance: target_instance

  # A low-rate recurring non-OK response demonstrates that target failures remain
  # measurements. It is intentionally excluded from the healthy smoke threshold.
  - name: KindUnaryExpectedTargetFailure
    endpoint: http://grpc-target:50051
    scenarios_per_sec: 1
    max_concurrency: 1
    duration: 2s
    repeat:
      type: every
      interval: 30s
    partition_key_strategy: execution_key
    steps:
      - protocol: grpc
        service: pulse.demo.v1.DemoService
        method: Echo
        request_fields:
          message: pulse-kind-expected-target-failure
          delay_ms: 20
          fail: true
