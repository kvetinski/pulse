apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pulse-runtime-alerts
  namespace: pulse-staging
  labels:
    app: pulse
    release: prometheus
spec:
  groups:
    - name: pulse-runtime-availability
      rules:
        - alert: PulseNoSchedulerLeader
          expr: max(pulse_scheduler_is_leader) < 1
          for: 5m
          labels:
            severity: critical
            service: pulse
            env: staging
          annotations:
            summary: "Pulse scheduler leader is missing"
            description: "No pulse leader detected for 5m in namespace pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseHighScenarioFailureRatio
          expr: |
            (
              sum(rate(pulse_scenario_executions_total{status="failure"}[5m]))
              /
              clamp_min(sum(rate(pulse_scenario_executions_total[5m])), 1)
            ) > 0.03
          for: 10m
          labels:
            severity: critical
            service: pulse
            env: staging
          annotations:
            summary: "Pulse scenario failure ratio is high"
            description: "Scenario failure ratio has been above 3% for 10m in pulse-staging."
            runbook: "docs/runbook.md"

    - name: pulse-runtime-performance
      rules:
        - alert: PulseScenarioLatencyP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(pulse_scenario_duration_seconds_bucket{status="success"}[10m]))
            ) > 1.5
          for: 15m
          labels:
            severity: warning
            service: pulse
            env: staging
          annotations:
            summary: "Pulse scenario p95 latency is high"
            description: "Scenario p95 latency has been above 1.5s for 15m in pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseWorkerConsumeErrorsHigh
          expr: |
            (
              rate(pulse_worker_job_consume_errors_total[5m])
              /
              clamp_min(rate(pulse_worker_jobs_received_total[5m]), 1)
            ) > 0.01
          for: 10m
          labels:
            severity: warning
            service: pulse
            env: staging
          annotations:
            summary: "Pulse worker consume error ratio is high"
            description: "Consume errors exceed 1% over 10m in pulse-staging."
            runbook: "docs/runbook.md"

    - name: pulse-runtime-dlq
      rules:
        - alert: PulseDlqActivityDetected
          expr: sum(rate(pulse_worker_dlq_published_total[5m])) > 0
          for: 10m
          labels:
            severity: warning
            service: pulse
            env: staging
          annotations:
            summary: "Pulse dead-letter queue activity detected"
            description: "DLQ publish rate is non-zero for 10m in pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseDlqPublishFailures
          expr: sum(rate(pulse_worker_dlq_publish_failures_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
            service: pulse
            env: staging
          annotations:
            summary: "Pulse dead-letter publish is failing"
            description: "DLQ publish failures are non-zero for 5m in pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseResultPublishFailures
          expr: sum(rate(pulse_worker_result_publish_failures_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
            service: pulse
            env: staging
          annotations:
            summary: "Pulse result publication is failing"
            description: "Result publication failures can leave source jobs unsettled in pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseSourceCommitFailures
          expr: sum(rate(pulse_worker_job_commit_failures_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
            service: pulse
            env: staging
          annotations:
            summary: "Pulse source offset commits are failing"
            description: "Synchronous source commit failures are non-zero in pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseUncommittedJobsStuck
          expr: sum(pulse_worker_uncommitted_jobs) > 0
          for: 5m
          labels:
            severity: critical
            service: pulse
            env: staging
          annotations:
            summary: "Pulse jobs remain unsettled"
            description: "At least one consumed job has remained uncommitted for 5m in pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseIncompleteDispatch
          expr: sum(pulse_scheduler_incomplete_dispatch_slices) > 0
          for: 5m
          labels:
            severity: warning
            service: pulse
            env: staging
          annotations:
            summary: "Pulse dispatch window is incomplete"
            description: "A deterministic scheduler slice has remained unacknowledged for 5m in pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseSummaryPublishFailures
          expr: sum(rate(pulse_kafka_publish_duration_seconds_count{kind="summary",outcome="failed"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
            service: pulse
            env: staging
          annotations:
            summary: "Pulse summary publication is failing"
            description: "The Redis summary outbox cannot publish acknowledged Kafka records in pulse-staging."
            runbook: "docs/runbook.md"

        - alert: PulseAggregateTimeouts
          expr: sum(rate(pulse_aggregate_results_total{outcome="timed_out"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            service: pulse
            env: staging
          annotations:
            summary: "Pulse runs are timing out incomplete"
            description: "At least one run reached its aggregation deadline without every slice in pulse-staging."
            runbook: "docs/runbook.md"
