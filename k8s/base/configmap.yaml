apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-config
  namespace: pulse
data:
  RUST_LOG: "info"
  # This application-only base is intentionally not directly runnable. Every
  # environment must patch target and managed dependency endpoints.
  PULSE_ENDPOINT: "http://replace-me:8080"
  PULSE_TARGET_ALLOWLIST: "replace-me"
  PULSE_SCENARIOS_FILE: "/app/scenarios.yaml"
  PULSE_GRPC_DESCRIPTOR_SET: "/app/descriptors/services.pb"
  PULSE_KAFKA_BROKERS: "replace-with-managed-kafka:9092"
  PULSE_KAFKA_JOBS_TOPIC: "pulse.scenario.jobs"
  PULSE_KAFKA_RESULTS_TOPIC: "pulse.scenario.results"
  PULSE_KAFKA_SUMMARIES_TOPIC: "pulse.scenario.summaries"
  PULSE_KAFKA_DLQ_TOPIC: "pulse.scenario.dlq"
  PULSE_KAFKA_GROUP_ID: "pulse-workers"
  PULSE_KAFKA_AGGREGATOR_GROUP_ID: "pulse-aggregators"
  PULSE_KAFKA_MAX_POLL_INTERVAL_MS: "300000"
  PULSE_KAFKA_SESSION_TIMEOUT_MS: "10000"
  PULSE_KAFKA_MESSAGE_TIMEOUT_MS: "10000"
  PULSE_KAFKA_DELIVERY_TIMEOUT_MS: "10000"
  PULSE_KAFKA_REQUEST_TIMEOUT_MS: "5000"
  PULSE_KAFKA_PRODUCER_ACKS: "all"
  PULSE_KAFKA_PRODUCER_IDEMPOTENCE: "true"
  PULSE_KAFKA_TOPIC_MANAGEMENT_ENABLED: "false"
  PULSE_KAFKA_TOPIC_PARTITIONS: "6"
  PULSE_KAFKA_TOPIC_REPLICATION_FACTOR: "3"
  PULSE_KAFKA_PRODUCER_QUEUE_MESSAGES: "1024"
  PULSE_KAFKA_PRODUCER_MESSAGE_MAX_BYTES: "1000000"
  PULSE_KAFKA_CONSUMER_QUEUE_KBYTES: "4096"
  PULSE_KAFKA_CONSUMER_PARTITION_FETCH_MAX_BYTES: "524288"
  PULSE_KAFKA_CONSUMER_FETCH_MAX_BYTES: "4194304"
  PULSE_KAFKA_CONSUMER_RECORD_MAX_BYTES: "1000000"
  PULSE_WORKER_MAX_RETRIES: "2"
  PULSE_WORKER_RETRY_BASE_DELAY_MS: "500"
  PULSE_WORKER_RETRY_MAX_DELAY_MS: "30000"
  PULSE_RETRY_QUEUE_CAPACITY: "1024"
  PULSE_REDIS_LEADER_KEY: "pulse:{coordination}:leader"
  PULSE_REDIS_SCHEDULE_PREFIX: "pulse:{coordination}:schedule"
  PULSE_REDIS_IDEMPOTENCY_PREFIX: "pulse:dedupe"
  PULSE_REDIS_AGGREGATION_PREFIX: "pulse:aggregation"
  PULSE_AGGREGATION_ENABLED: "true"
  PULSE_AGGREGATION_PARTIAL_TIMEOUT_MS: "60000"
  PULSE_AGGREGATION_RETENTION_MS: "86400000"
  PULSE_AGGREGATION_SCAN_INTERVAL_MS: "1000"
  PULSE_AGGREGATION_SCAN_BATCH: "128"
  PULSE_AGGREGATION_MAX_ACTIVE_RUNS: "10000"
  PULSE_AGGREGATION_MAX_ERROR_KINDS: "64"
  PULSE_LEADER_LOCK_TTL_MS: "10000"
  PULSE_LEADER_RENEW_INTERVAL_MS: "3000"
  PULSE_SCHEDULER_TICK_INTERVAL_MS: "500"
  PULSE_EXECUTION_LEASE_TTL_MS: "30000"
  PULSE_EXECUTION_LEASE_RENEW_INTERVAL_MS: "10000"
  PULSE_EXECUTION_TERMINAL_RETENTION_MS: "86400000"
  PULSE_STARTUP_DEADLINE_MS: "60000"
  PULSE_SHUTDOWN_DRAIN_TIMEOUT_MS: "30000"
  PULSE_GRPC_CONNECT_TIMEOUT_MS: "5000"
  PULSE_GRPC_REQUEST_TIMEOUT_MS: "5000"
  PULSE_GRPC_SCENARIO_TIMEOUT_MS: "30000"
  PULSE_MAX_DURATION_MS: "60000"
  PULSE_MAX_SCENARIOS_PER_SEC: "1000"
  PULSE_MAX_CONCURRENCY: "256"
  PULSE_STARTUP_BURST: "0"
  PULSE_ALLOW_PARTIAL_START: "false"
  PULSE_METRICS_ENABLED: "true"
  PULSE_METRICS_BIND: "0.0.0.0:9090"
