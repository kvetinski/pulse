name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: Rust Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Activate pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
          rust-analyzer --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            build-essential \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Validate release metadata
        run: make release-validate

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.31.0

      - name: Run quality and manifest gates
        run: make ci

      - name: Generate performance report artifacts (CI fixture)
        run: |
          PERF_OVERLAY=ci \
          PERF_REPORT_DIR=artifacts/reliability \
          PERF_HISTORY_FILE=artifacts/reliability/perf-history.jsonl \
          scripts/reliability/generate_ci_perf_artifacts.sh

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/reliability/perf-gate-*.json
            artifacts/reliability/perf-gate-*.log
            artifacts/reliability/perf-report-*.md
            artifacts/reliability/perf-report-*.svg
            artifacts/reliability/performance-history.html
            artifacts/reliability/perf-history-*.svg
            artifacts/reliability/perf-history.jsonl
          if-no-files-found: warn
          retention-days: 14

  integration-compose:
    name: Integration (Kafka + Redis via Compose)
    runs-on: ubuntu-latest
    needs: rust

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Activate pinned Rust toolchain
        run: rustc --version --verbose

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            build-essential \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run compose-backed integration tests
        run: make test-integration-compose

      - name: Tear down compose dependencies
        if: always()
        run: make test-compose-down

  supply-chain:
    name: Supply-Chain Security
    runs-on: ubuntu-latest
    needs: rust

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Activate pinned Rust toolchain
        run: rustc --version --verbose

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            build-essential \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run supply-chain checks
        run: make supply-chain-check

      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/security/trivy-image-report.json
            artifacts/security/pulse-image-sbom.spdx.json
            artifacts/security/trivy-demo-target-report.json
            artifacts/security/pulse-demo-target-sbom.spdx.json
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust, integration-compose, supply-chain]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image
        run: docker build -t pulse:ci .

      - name: Validate image descriptor and dry-run startup
        run: |
          docker run --rm \
            -e PULSE_DRY_RUN=true \
            -e PULSE_SCENARIOS_FILE=/app/scenarios.yaml \
            -e PULSE_GRPC_DESCRIPTOR_SET=/app/descriptors/services.pb \
            -e PULSE_ENDPOINT=http://host.docker.internal:8080 \
            -e PULSE_TARGET_ALLOWLIST=host.docker.internal \
            pulse:ci

      - name: Build self-contained demo images
        run: |
          docker build -f demo/Dockerfile.pulse -t pulse-demo:ci .
          docker build -f demo/grpc-target/Dockerfile -t pulse-demo-target:ci .
